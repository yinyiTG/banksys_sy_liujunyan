name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先确保服务器部署目录存在
      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/banksys_sy_liujunyan

      # 将仓库文件上传到服务器部署目录(SCP 上传,部署脚本在服务器上执行)
      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src,data,Dockerfile,requirements.txt,deploy.sh"
          strip_components: 0
          target: /opt/banksys_sy_liujunyan

      - name: Run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/banksys_sy_liujunyan
            chmod +x deploy.sh
            bash deploy.sh
